<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="description" content="Wholesale &amp; Distribution Management" />
    <meta name="application-name" content="Godamo" />
    <title>Godamo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script src="/assets/vendor/nepali-date-converter.umd.js"></script>
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body>
    <!-- Filled in by app.js once the user's account has loaded. -->
    <div id="root">
      <div class="shell shell-skeleton" aria-busy="true" aria-label="Loading">
        <div class="sidebar-ghost"></div>
        <div style="flex: 1">
          <div class="top">
            <div class="skeleton" style="height: 1.25rem; width: 12rem"></div>
            <div class="skeleton" style="margin-left: auto; height: 2rem; width: 2rem; border-radius: 9999px"></div>
          </div>
          <div class="grid-stats" style="padding: 1.5rem">
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
            <div class="skeleton" style="height: 7rem; border-radius: 0.875rem; background: var(--card)"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
